<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="StockPulse — Offline-first Inventory, Purchase Order, and GST Billing Management System">
  <title>StockPulse — Inventory, PO & GST Billing System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="theme-dark">
  <div id="app" class="app-container">
    <!-- Main Header & Navigation -->
    <header class="app-header" id="app-header"></header>

    <!-- Content Router Outlet -->
    <main class="app-main" id="app-root">
      <div class="loader-container">
        <div class="spinner"></div>
        <p>Loading StockPulse Engine...</p>
      </div>
    </main>

    <!-- Global Toast Notifications Container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Generic Modal Dialog Shell -->
    <dialog id="app-modal" class="app-modal">
      <div class="modal-backdrop"></div>
      <div class="modal-card" id="modal-content"></div>
    </dialog>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
